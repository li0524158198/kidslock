plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidslock.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kidslock.app"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.2"
    }

    // 签名配置从本地 keystore.properties 读取（该文件不入库，见 keystore.properties.example）
    // 无该文件时构建未签名 release 包，不影响编译
    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        ksFile.withInputStream { ksProps.load(it) }
    }

    signingConfigs {
        release {
            if (ksProps.containsKey('storeFile')) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Bundle APK splits for different ABIs - smaller APK for TV
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
}
