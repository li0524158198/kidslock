name: Build iOS App

# 在 GitHub 的 macOS Runner 上编译 iOS 应用（无需本地 Mac）。
# 触发方式：手动运行（workflow_dispatch）。
# 产物：
#   - KidsLock-simulator.app  —— iPhone 模拟器可直接运行
#   - KidsLock-unsigned.ipa   —— 未签名 IPA，可通过 AltStore / Sideloadly 等自签侧载
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build for iOS Simulator
        run: |
          cd KidsLock
          xcodebuild -project KidsLock.xcodeproj \
            -scheme KidsLock \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package simulator .app
        run: |
          cd KidsLock/build/Build/Products/Release-iphonesimulator
          zip -qry $GITHUB_WORKSPACE/KidsLock-simulator.app.zip KidsLock.app

      - name: Build unsigned IPA (arm64 device)
        run: |
          cd KidsLock
          xcodebuild -project KidsLock.xcodeproj \
            -scheme KidsLock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/KidsLock.app Payload/
          zip -qry KidsLock-unsigned.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KidsLock-iOS
          path: |
            KidsLock-simulator.app.zip
            KidsLock/KidsLock-unsigned.ipa
